[package]
name = "todo-calendar"
version = "0.1.0"
description = "날짜 있는 할 일과 언젠가 할 일을 함께 관리하는 개인용 달력 + 체크리스트"
edition = "2021"

[lib]
name = "todo_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
uuid = { version = "1.29.3", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4.35"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
